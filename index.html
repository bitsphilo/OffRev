<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OffRev</title>
    <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.4.120/build/pdf.min.js"></script>
    <style>
        * {box-sizing: border-box; font-family: Arial, sans-serif; margin: 0; padding: 0;}
        body {max-width: 700px; margin: 20px auto; padding: 15px; background: #f8f0fc;}
        h1 {text-align: center; color: #4a148c; margin-bottom: 10px;}
        .upload-box {background: white; padding: 20px; border-radius: 10px; border: 2px solid #ce93d8; margin-bottom: 15px;}
        input {margin: 10px 0;}
        button {width: 100%; padding: 10px; margin: 5px 0; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;}
        .btn-purple {background: #9c27b0; color: white;}
        .btn-green {background: #8e24aa; color: white;}
        .status {padding: 10px; margin: 10px 0; border-radius: 6px; text-align: center; font-weight: bold; background: #f3e5f5; color: #4a148c;}
        .progress {width: 100%; height: 10px; background: #e1bee7; border-radius: 5px; margin: 10px 0; display: none;}
        .progress-fill {height: 100%; width: 0%; background: #9c27b0;}
        .card {background: white; padding: 15px; margin: 10px 0; border-radius: 8px; border-left: 4px solid #9c27b0;}
        .q {font-weight: bold; color: #4a148c; margin-bottom: 5px;}
        .hidden {display: none !important;}
    </style>
</head>
<body>
    <h1>🗂️ OffRev</h1>

    <div class="upload-box">
        <h3>Upload your PDF</h3>
        <input type="file" id="pdfFile" accept=".pdf">
        <div id="status" class="status">Ready</div>
        <div class="progress" id="progressBar"><div class="progress-fill" id="fill"></div></div>
    </div>

    <button id="genBtn" class="btn-purple hidden">Make Flashcards</button>
    <button id="clearBtn" class="btn-green hidden">Clear</button>
    <div id="cards"></div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.4.120/build/pdf.worker.min.js';
        
        const fileInput = document.getElementById('pdfFile');
        const status = document.getElementById('status');
        const progressBar = document.getElementById('progressBar');
        const fill = document.getElementById('fill');
        const genBtn = document.getElementById('genBtn');
        const clearBtn = document.getElementById('clearBtn');
        const cardsDiv = document.getElementById('cards');
        let pdfText = '';

        fileInput.addEventListener('change', async e => {
            const file = e.target.files[0];
            if (!file) return;
            status.textContent = Selected: ${file.name};
            if (file.size > 20*1024*1024) return status.textContent = '❌ File too big';
            
            genBtn.classList.add('hidden');
            clearBtn.classList.add('hidden');
            cardsDiv.innerHTML = '';
            pdfText = '';
            progressBar.style.display = 'block';
            fill.style.width = '5%';
            status.textContent = 'Loading...';

            try {
                const pdf = await pdfjsLib.getDocument({data: await file.arrayBuffer()}).promise;
                fill.style.width = '20%';
                status.textContent = Reading ${pdf.numPages} pages...;
                
                for (let i=1; i<=pdf.numPages; i++) {
                    fill.style.width = ${20 + (i/pdf.numPages)*70}%;
                    const page = await pdf.getPage(i);
                    const text = await page.getTextContent();
                    pdfText += text.items.map(t => t.str).join(' ') + ' ';
                }

                if (pdfText.trim().length < 50) throw new Error('No readable text');
                fill.style.width = '100%';
                status.textContent = '✅ Ready! Click button below';
                setTimeout(() => {
                    progressBar.style.display = 'none';
                    genBtn.classList.remove('hidden');
                    clearBtn.classList.remove('hidden');
                }, 500);

            } catch (err) {
                status.textContent = '❌ ' + err.message;
                progressBar.style.display = 'none';
            }
        });

        genBtn.addEventListener('click', () => {
            status.textContent = 'Making cards...';
            const sentences = pdfText.split(/[.!?]/).filter(s => s.trim().length > 20);
            const cards = [];
            for (let i=0; i<Math.min(sentences.length, 20); i++) {
                const s = sentences[i].trim();
                const words = s.split(' ');
                const term = words[Math.floor(Math.random()*words.length)];
                cards.push({q: s.replace(new RegExp(term,'gi'), '___'), a: term});
            }
            cards.forEach((c, idx) => {
                cardsDiv.innerHTML += <div class="card"><div class="q">Card ${idx+1}: ${c.q}</div><div>Answer: ${c.a}</div></div>;
            });
            status.textContent = ✅ Done! ${cards.length} flashcards made;
        });

        clearBtn.addEventListener('click', () => {
            fileInput.value = ''; pdfText = ''; cardsDiv.innerHTML = '';
            genBtn.classList.add('hidden'); clearBtn.classList.add('hidden');
            status.textContent = 'Ready';
        });
    </script>
</body>
</html>
